[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-cic"
version = "0.3.6"
description = "Holonic, ECS-inspired personal command environment"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9,<8",
]

[project.scripts]
cic-self = "personal_cic.app:main"
cic-runtime = "personal_cic.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"personal_cic.presentation" = [
    "vendor/maplibre/*.js",
    "vendor/maplibre/*.css",
    "vendor/maplibre/*.txt",
    "vendor/maplibre/*.json",
    "vendor/maplibre/*.md",
]
